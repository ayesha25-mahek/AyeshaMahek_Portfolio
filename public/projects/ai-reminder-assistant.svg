<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0533"/>
      <stop offset="100%" style="stop-color:#0f0a1e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#1e1040" opacity="0.9"/>
  <text x="24" y="34" font-family="Arial" font-size="16" font-weight="bold" fill="#a78bfa">🧠 AI Reminder</text>
  <text x="580" y="34" font-family="Arial" font-size="11" fill="#7c3aed">Dashboard</text>
  <text x="650" y="34" font-family="Arial" font-size="11" fill="#94a3b8">Settings</text>
  <!-- Chat panel left -->
  <rect x="20" y="70" width="340" height="410" rx="12" fill="#13072e" stroke="#3730a3" stroke-width="1"/>
  <text x="36" y="98" font-family="Arial" font-size="12" font-weight="bold" fill="#c4b5fd">Natural Language Input</text>
  <!-- Chat bubbles -->
  <rect x="36" y="110" width="240" height="36" rx="18" fill="#312e81"/>
  <text x="156" y="133" font-family="Arial" font-size="11" fill="#e2e8f0" text-anchor="middle">Remind me to study in 20 minutes</text>
  <rect x="160" y="160" width="188" height="36" rx="18" fill="#7c3aed"/>
  <text x="254" y="183" font-family="Arial" font-size="11" fill="white" text-anchor="middle">✓ Reminder set for 8:20 PM</text>
  <rect x="36" y="210" width="200" height="36" rx="18" fill="#312e81"/>
  <text x="136" y="233" font-family="Arial" font-size="11" fill="#e2e8f0" text-anchor="middle">Meeting with Rahul at 3pm tmrw</text>
  <rect x="120" y="260" width="228" height="36" rx="18" fill="#7c3aed"/>
  <text x="234" y="283" font-family="Arial" font-size="11" fill="white" text-anchor="middle">✓ Reminder set for tomorrow 3:00 PM</text>
  <!-- Input box -->
  <rect x="36" y="430" width="300" height="36" rx="18" fill="#1e1040" stroke="#4c1d95" stroke-width="1"/>
  <text x="60" y="452" font-family="Arial" font-size="11" fill="#64748b">Type a reminder...</text>
  <circle cx="318" cy="448" r="14" fill="url(#purple)"/>
  <text x="318" y="454" font-family="Arial" font-size="12" fill="white" text-anchor="middle">➤</text>
  <!-- Reminders panel right -->
  <rect x="374" y="70" width="406" height="200" rx="12" fill="#13072e" stroke="#3730a3" stroke-width="1"/>
  <text x="390" y="98" font-family="Arial" font-size="12" font-weight="bold" fill="#c4b5fd">Upcoming Reminders</text>
  <rect x="390" y="110" width="374" height="44" rx="8" fill="#1e1040"/>
  <text x="406" y="128" font-family="Arial" font-size="11" fill="#a78bfa">📚 Study Session</text>
  <text x="406" y="146" font-family="Arial" font-size="10" fill="#64748b">Today · 8:20 PM · in 18 min</text>
  <rect x="726" y="118" width="28" height="28" rx="6" fill="#7c3aed" opacity="0.3"/>
  <text x="740" y="136" font-family="Arial" font-size="10" fill="#a78bfa" text-anchor="middle">✕</text>
  <rect x="390" y="162" width="374" height="44" rx="8" fill="#1e1040"/>
  <text x="406" y="180" font-family="Arial" font-size="11" fill="#f472b6">👥 Meeting with Rahul</text>
  <text x="406" y="198" font-family="Arial" font-size="10" fill="#64748b">Tomorrow · 3:00 PM · 27h 18min</text>
  <!-- Stats panel -->
  <rect x="374" y="284" width="196" height="196" rx="12" fill="#13072e" stroke="#3730a3" stroke-width="1"/>
  <text x="472" y="312" font-family="Arial" font-size="12" font-weight="bold" fill="#c4b5fd" text-anchor="middle">Stats</text>
  <text x="472" y="358" font-family="Arial" font-size="36" font-weight="bold" fill="url(#purple)" text-anchor="middle">24</text>
  <text x="472" y="378" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">Reminders this week</text>
  <text x="472" y="420" font-family="Arial" font-size="28" font-weight="bold" fill="#10b981" text-anchor="middle">92%</text>
  <text x="472" y="440" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">On-time rate</text>
  <!-- NLP panel -->
  <rect x="584" y="284" width="196" height="196" rx="12" fill="#13072e" stroke="#3730a3" stroke-width="1"/>
  <text x="682" y="312" font-family="Arial" font-size="12" font-weight="bold" fill="#c4b5fd" text-anchor="middle">NLP Parser</text>
  <text x="600" y="338" font-family="Arial" font-size="9" fill="#94a3b8">"in 20 minutes"</text>
  <rect x="600" y="346" width="64" height="18" rx="4" fill="#7c3aed" opacity="0.3"/>
  <text x="632" y="359" font-family="Arial" font-size="9" fill="#a78bfa" text-anchor="middle">DURATION</text>
  <text x="600" y="386" font-family="Arial" font-size="9" fill="#94a3b8">"study"</text>
  <rect x="600" y="394" width="52" height="18" rx="4" fill="#10b981" opacity="0.3"/>
  <text x="626" y="407" font-family="Arial" font-size="9" fill="#10b981" text-anchor="middle">ACTION</text>
  <text x="600" y="428" font-family="Arial" font-size="9" fill="#94a3b8">"tomorrow 3pm"</text>
  <rect x="600" y="436" width="72" height="18" rx="4" fill="#f59e0b" opacity="0.3"/>
  <text x="636" y="449" font-family="Arial" font-size="9" fill="#f59e0b" text-anchor="middle">DATETIME</text>
</svg>
