<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1445"/>
      <stop offset="100%" style="stop-color:#1a0533"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Header -->
  <rect x="0" y="0" width="800" height="56" fill="#0a0f3d" opacity="0.95"/>
  <text x="24" y="36" font-family="Arial" font-size="18" font-weight="bold" fill="#f59e0b">🏛 CivicaConnect</text>
  <text x="600" y="36" font-family="Arial" font-size="11" fill="#94a3b8">Hindi</text>
  <text x="640" y="36" font-family="Arial" font-size="11" fill="#94a3b8">Telugu</text>
  <text x="690" y="36" font-family="Arial" font-size="11" fill="#f59e0b">தமிழ்</text>
  <!-- Language selector -->
  <text x="400" y="90" font-family="Arial" font-size="22" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Government Services in Your Language</text>
  <text x="400" y="114" font-family="Arial" font-size="12" fill="#94a3b8" text-anchor="middle">Ask about ration cards, pensions, health schemes in Hindi, Telugu, Tamil &amp; more</text>
  <!-- Search box -->
  <rect x="100" y="130" width="600" height="44" rx="22" fill="#1e2a5a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="130" y="157" font-family="Arial" font-size="12" fill="#94a3b8">राशन कार्ड के लिए आवेदन कैसे करें? (How to apply for ration card?)</text>
  <circle cx="680" cy="152" r="16" fill="#f59e0b"/>
  <text x="680" y="158" font-family="Arial" font-size="12" fill="#0c1445" text-anchor="middle">🔍</text>
  <!-- RAG pipeline visualization -->
  <rect x="24" y="194" width="220" height="280" rx="12" fill="#111c4a" stroke="#1e3a8a" stroke-width="1"/>
  <text x="134" y="220" font-family="Arial" font-size="11" font-weight="bold" fill="#93c5fd" text-anchor="middle">RAG Pipeline</text>
  <rect x="44" y="232" width="180" height="34" rx="8" fill="#1e3a8a"/>
  <text x="134" y="253" font-family="Arial" font-size="10" fill="#bfdbfe" text-anchor="middle">1. Query Encoding</text>
  <text x="134" y="278" font-family="Arial" font-size="16" fill="#60a5fa" text-anchor="middle">↓</text>
  <rect x="44" y="286" width="180" height="34" rx="8" fill="#1e3a8a"/>
  <text x="134" y="307" font-family="Arial" font-size="10" fill="#bfdbfe" text-anchor="middle">2. Semantic Search</text>
  <text x="134" y="332" font-family="Arial" font-size="16" fill="#60a5fa" text-anchor="middle">↓</text>
  <rect x="44" y="340" width="180" height="34" rx="8" fill="#1e3a8a"/>
  <text x="134" y="361" font-family="Arial" font-size="10" fill="#bfdbfe" text-anchor="middle">3. Context Retrieval</text>
  <text x="134" y="386" font-family="Arial" font-size="16" fill="#60a5fa" text-anchor="middle">↓</text>
  <rect x="44" y="394" width="180" height="34" rx="8" fill="#f59e0b" opacity="0.8"/>
  <text x="134" y="415" font-family="Arial" font-size="10" fill="#0c1445" font-weight="bold" text-anchor="middle">4. Multilingual Response</text>
  <!-- Response panel -->
  <rect x="260" y="194" width="516" height="280" rx="12" fill="#111c4a" stroke="#1e3a8a" stroke-width="1"/>
  <text x="280" y="220" font-family="Arial" font-size="11" font-weight="bold" fill="#f59e0b">Response in Hindi (हिंदी)</text>
  <rect x="274" y="228" width="488" height="120" rx="8" fill="#0c1445"/>
  <text x="290" y="252" font-family="Arial" font-size="11" fill="#e2e8f0">राशन कार्ड के लिए आवेदन करने के लिए:</text>
  <text x="290" y="272" font-family="Arial" font-size="10" fill="#94a3b8">1. नजदीकी राशन दफ्तर जाएं</text>
  <text x="290" y="290" font-family="Arial" font-size="10" fill="#94a3b8">2. आधार कार्ड और पता प्रमाण लाएं</text>
  <text x="290" y="308" font-family="Arial" font-size="10" fill="#94a3b8">3. फॉर्म भरें और जमा करें</text>
  <text x="290" y="326" font-family="Arial" font-size="10" fill="#94a3b8">4. 30 दिनों में कार्ड मिलेगा</text>
  <!-- Source docs -->
  <text x="280" y="374" font-family="Arial" font-size="10" fill="#64748b">Sources retrieved:</text>
  <rect x="274" y="382" width="148" height="24" rx="6" fill="#1e3a8a"/>
  <text x="348" y="398" font-family="Arial" font-size="9" fill="#93c5fd" text-anchor="middle">📄 Ration Card Scheme</text>
  <rect x="432" y="382" width="140" height="24" rx="6" fill="#1e3a8a"/>
  <text x="502" y="398" font-family="Arial" font-size="9" fill="#93c5fd" text-anchor="middle">📄 NFSA Guidelines</text>
  <!-- Language tabs -->
  <rect x="274" y="418" width="64" height="24" rx="6" fill="#f59e0b"/>
  <text x="306" y="434" font-family="Arial" font-size="9" fill="#0c1445" font-weight="bold" text-anchor="middle">हिंदी</text>
  <rect x="346" y="418" width="64" height="24" rx="6" fill="#1e3a8a"/>
  <text x="378" y="434" font-family="Arial" font-size="9" fill="#93c5fd" text-anchor="middle">తెలుగు</text>
  <rect x="418" y="418" width="64" height="24" rx="6" fill="#1e3a8a"/>
  <text x="450" y="434" font-family="Arial" font-size="9" fill="#93c5fd" text-anchor="middle">தமிழ்</text>
  <rect x="490" y="418" width="64" height="24" rx="6" fill="#1e3a8a"/>
  <text x="522" y="434" font-family="Arial" font-size="9" fill="#93c5fd" text-anchor="middle">English</text>
</svg>
